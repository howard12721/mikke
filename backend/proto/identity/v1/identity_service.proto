syntax = "proto3";

package mikke.identity.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

option java_multiple_files = true;
option java_package = "jp.xhw.mikke.identity.v1";

service IdentityService {
  // Registers a new user in the identity domain.
  // This API assumes email/password sign up as the initial auth method.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);

  // Authenticates a user and returns a session for the client.
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);

  // Extends idle lifetime for an active session.
  rpc TouchSession(TouchSessionRequest) returns (TouchSessionResponse);

  // Revokes the current client session.
  rpc LogoutSession(LogoutSessionRequest) returns (LogoutSessionResponse);

  // Returns the current authenticated user.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // Returns a public user profile by id.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Returns public user profiles by id.
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);

  // Searches users by username.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Updates the current user's profile.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Deactivates the current authenticated user.
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse);

  // Changes the current authenticated user's password.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  string display_name = 4;
}

message RegisterUserResponse {
  User user = 1;
  AuthSession session = 2;
}

message LoginUserRequest {
  // Login identifier. The server may accept email or username.
  string login_id = 1;
  string password = 2;
}

message LoginUserResponse {
  User user = 1;
  AuthSession session = 2;
}

message TouchSessionRequest {
  string session_hash = 1;
}

message TouchSessionResponse {}

message LogoutSessionRequest {
  string session_hash = 1;
}

message LogoutSessionResponse {}

message GetMeRequest {
  mikke.common.v1.ActorContext actor = 1;
}

message GetMeResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  PublicUser user = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message BatchGetUsersResponse {
  repeated PublicUser users = 1;
}

message SearchUsersRequest {
  string query = 1;
  mikke.common.v1.PageRequest page = 2;
}

message SearchUsersResponse {
  repeated PublicUser users = 1;
  mikke.common.v1.PageInfo page_info = 2;
}

message UpdateProfileRequest {
  mikke.common.v1.ActorContext actor = 1;
  string username = 2;
  string display_name = 3;
  string avatar_media_id = 4;
}

message UpdateProfileResponse {
  User user = 1;
}

message DeactivateAccountRequest {
  mikke.common.v1.ActorContext actor = 1;
}

message DeactivateAccountResponse {}

message ChangePasswordRequest {
  mikke.common.v1.ActorContext actor = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string display_name = 4;
  UserStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string avatar_media_id = 8;
}

message PublicUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  UserStatus status = 4;
  string avatar_media_id = 5;
}

message AuthSession {
  string session_id = 1;
  google.protobuf.Timestamp idle_expires_at = 2;
  google.protobuf.Timestamp absolute_expires_at = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_DEACTIVATED = 3;
}
