---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: post-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: post-service
    spec:
      initContainers:
      - name: migrate-db
        image: ghcr.io/howard12721/mikke-migrations
        env:
        - name: MIGRATION_SERVICE
          value: post-service
        - name: MARIADB_HOST
          value: mariadb
        - name: MARIADB_PORT
          value: '3306'
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: password
      containers:
      - name: post-service
        image: ghcr.io/howard12721/mikke-post-service
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50053
          name: grpc
        env:
        - name: POST_SERVICE_PORT
          value: '50053'
        - name: MARIADB_HOST
          value: mariadb
        - name: MARIADB_PORT
          value: '3306'
        - name: MARIADB_DATABASE
          value: post_service
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: password
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: IDENTITY_SERVICE_HOST
          value: identity-service
        - name: IDENTITY_SERVICE_PORT
          value: '50051'
        - name: IDENTITY_SERVICE_TARGET
          value: dns:///identity-service:50051
        - name: FRIENDSHIP_SERVICE_HOST
          value: friendship-service
        - name: FRIENDSHIP_SERVICE_PORT
          value: '50052'
        - name: FRIENDSHIP_SERVICE_TARGET
          value: dns:///friendship-service:50052
        - name: MEDIA_SERVICE_HOST
          value: media-service
        - name: MEDIA_SERVICE_PORT
          value: '50054'
        - name: MEDIA_SERVICE_TARGET
          value: dns:///media-service:50054
        - name: IDENTITY_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: identity-auth
              key: jwt-secret
        - name: MIKKE_INTERNAL_RPC_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-rpc-auth
              key: token
        readinessProbe:
          grpc:
            port: 50053
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50053
          initialDelaySeconds: 30
          periodSeconds: 20
