---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      initContainers:
      - name: migrate-db
        image: ghcr.io/howard12721/mikke-migrations
        env:
        - name: MIGRATION_SERVICE
          value: notification-service
        - name: MARIADB_HOST
          value: mariadb
        - name: MARIADB_PORT
          value: '3306'
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: password
      containers:
      - name: notification-service
        image: ghcr.io/howard12721/mikke-notification-service
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50057
          name: grpc
        env:
        - name: NOTIFICATION_SERVICE_PORT
          value: '50057'
        - name: MARIADB_HOST
          value: mariadb
        - name: MARIADB_PORT
          value: '3306'
        - name: MARIADB_DATABASE
          value: notification_service
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-auth
              key: password
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: FRIENDSHIP_SERVICE_HOST
          value: friendship-service
        - name: FRIENDSHIP_SERVICE_PORT
          value: '50052'
        - name: FRIENDSHIP_SERVICE_TARGET
          value: dns:///friendship-service:50052
        - name: MIKKE_INTERNAL_RPC_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-rpc-auth
              key: token
        - name: NOTIFICATION_REGISTRATION_ENCRYPTION_KEY_BASE64
          valueFrom:
            secretKeyRef:
              name: firebase-admin
              key: registration-encryption-key-base64
        - name: FCM_ENABLED
          value: 'true'
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: firebase-admin
              key: project-id
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/secrets/firebase/service-account.json
        volumeMounts:
        - name: firebase-admin
          mountPath: /var/run/secrets/firebase
          readOnly: true
        readinessProbe:
          grpc:
            port: 50057
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50057
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: firebase-admin
        secret:
          secretName: firebase-admin
          items:
          - key: service-account.json
            path: service-account.json
